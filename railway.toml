# Railway deployment config for the FastAPI backend
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Force Docker — prevents Railpack/Nixpacks auto-detection
builder = "DOCKERFILE"
dockerfilePath = "web_application/Dockerfile.backend"

[deploy]
# PORT is expanded via sh -c in the Dockerfile CMD
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
