# Railway deployment config for the FastAPI backend
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Build context is the repo root (Railway clones the full repo)
dockerfilePath = "web_application/Dockerfile.backend"

[deploy]
# Railway injects $PORT — override the Dockerfile CMD to use it
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000} --loop uvloop --http httptools --proxy-headers --forwarded-allow-ips=*"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
